<header class="hud-top-bar">
  <!-- Vänster: Fönsterkontroller, Logo/Titel & Systemstatus -->
  <div class="hud-left-group">
    <div class="window-controls" aria-hidden="true">
      <span class="dot dot-close"></span>
      <span class="dot dot-minimize"></span>
      <span class="dot dot-expand"></span>
    </div>

    <div class="app-branding">
      <span class="app-title">InvestAI</span>
    </div>

    <div class="status-pill status-optimal">
      <span class="status-led"></span>
      <span class="status-label">SYSTEM STATUS:</span>
      <span class="status-value">OPTIMAL</span>
    </div>
  </div>

  <!-- Mitten: Digital HUD-Klocka & Datum -->
  <div class="hud-center-clock">
    <div class="clock-date">MONDAY, 15 JUNE 2026</div>
    <div class="clock-time">
      <span class="time-digits">11:18:21 AM</span>
      <span class="time-tz">CET</span>
    </div>
  </div>

  <!-- Höger: Sökfält (⌘K), Snabbverktyg & Operatörsbricka -->
  <div class="hud-right-group">
    <div class="hud-search">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search HUD..." aria-label="Search HUD" />
      <kbd class="hud-kbd">⌘K</kbd>
    </div>

    <div class="hud-actions">
      <button type="button" class="hud-icon-btn" title="Grid Apps" aria-label="Grid Apps">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
      </button>

      <button type="button" class="hud-icon-btn" title="Notiser" aria-label="Notiser">
        <span class="notification-indicator"></span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>

      <button type="button" class="hud-icon-btn" title="Inställningar" aria-label="Inställningar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <!-- Operatör / Användare -->
    <div class="operator-profile">
      <div class="operator-meta">
        <span class="op-name">Operator</span>
        <span class="op-rank">Commander <span class="op-sep">//</span> L-9</span>
      </div>
      <div class="operator-avatar">OP</div>
    </div>
  </div>
</header>
